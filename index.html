<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="버킷츠 매출·손익·광고·점포·온라인 채널 대시보드">
  <meta name="application-name" content="버킷츠 대시보드">
  <meta name="apple-mobile-web-app-title" content="버킷츠 대시보드">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>버킷츠 대시보드</title>
  <link rel="manifest" href="manifest.webmanifest?appv=20260803-hero-month-5">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" href="favicon.ico">
  <script>
    (function() {
      if (!('serviceWorker' in navigator) || !/^https?:$/.test(window.location.protocol)) return;
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js?v=20260803-hero-month-5', {
          scope: './',
          updateViaCache: 'none'
        }).then(function(registration) {
          registration.update();
        }).catch(function() {});
      });
    })();
  </script>
  <style>
    :root {
      --bg: #f3f5f7;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #111827;
      --muted: #667085;
      --line: #e5e7eb;
      --navy: #0f172a;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #07875c;
      --green-soft: #ecfdf5;
      --red: #c93d4b;
      --red-soft: #fff1f2;
      --amber: #a15c05;
      --amber-soft: #fff8e7;
      --radius: 20px;
      --shadow: 0 8px 26px rgba(15, 23, 42, .06);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -.015em;
    }

    button, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(100%, 920px);
      margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 14px calc(94px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 16px 2px 13px;
      background: linear-gradient(var(--bg) 82%, rgba(243,245,247,0));
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .eyebrow {
      margin-bottom: 3px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -.045em;
    }

    .updated {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .refresh {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 13px;
      background: rgba(255,255,255,.94);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(15,23,42,.04);
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh:disabled { opacity: .55; cursor: default; }

    main { display: grid; gap: 14px; }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 21px;
      border-radius: 25px;
      color: #fff;
      background: linear-gradient(135deg, #111827, #172554 70%, #1d4ed8);
      box-shadow: 0 16px 36px rgba(15,23,42,.18);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -70px;
      top: -85px;
      border-radius: 50%;
      background: rgba(255,255,255,.09);
    }

    .hero-label { color: rgba(255,255,255,.7); font-size: 13px; }
    .hero-value { margin-top: 8px; font-size: 34px; font-weight: 850; letter-spacing: -.055em; }
    .hero-sub { margin-top: 8px; color: rgba(255,255,255,.78); font-size: 13px; }
    .hero-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .hero-tag { padding: 7px 10px; border-radius: 999px; background: rgba(255,255,255,.11); font-size: 12px; }
    .hero > * { position: relative; z-index: 1; }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .hero-top .hero-label { min-width: 0; padding-top: 10px; }
    .overview-period-control {
      display: grid;
      grid-template-columns: 34px 106px 34px;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }
    .overview-period-select {
      width: 100%;
      min-width: 0;
      height: 36px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      padding: 0 5px;
      background: rgba(255,255,255,.13);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      outline: none;
    }
    .overview-period-select option { background: #fff; color: var(--text); }
    .overview-period-select:focus { border-color: rgba(255,255,255,.75); box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
    .overview-period-arrow {
      display: grid;
      place-items: center;
      width: 34px;
      height: 36px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      background: rgba(255,255,255,.13);
      color: #fff;
      font-size: 23px;
      font-weight: 850;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .overview-period-arrow:active { transform: scale(.96); background: rgba(255,255,255,.22); }
    .overview-period-arrow:focus-visible { outline: 3px solid rgba(255,255,255,.12); border-color: rgba(255,255,255,.75); }
    .overview-period-arrow:disabled { opacity: .28; cursor: default; transform: none; }

    @media (max-width: 359px) {
      .hero { padding-left: 15px; padding-right: 15px; }
      .overview-period-control { grid-template-columns: 32px 92px 32px; gap: 4px; }
      .overview-period-arrow { width: 32px; }
      .overview-period-select { font-size: 11px; }
    }

    .section {
      padding: 17px;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .section-title { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .section-note { margin-top: 4px; color: var(--muted); font-size: 12px; }

    .year-select {
      min-width: 93px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 30px 9px 11px;
      background: var(--surface-soft);
      color: var(--text);
      font-weight: 700;
      outline: none;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .kpi {
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
    }

    .kpi-label { color: var(--muted); font-size: 12px; }
    .kpi-value { margin-top: 7px; font-size: 21px; font-weight: 830; letter-spacing: -.045em; overflow-wrap: anywhere; }
    .kpi-sub { margin-top: 6px; color: var(--muted); font-size: 11px; }
    .positive { color: var(--green) !important; }
    .negative { color: var(--red) !important; }
    .neutral { color: var(--text) !important; }

    .split { display: grid; gap: 8px; }
    .split-row { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 10px; }
    .split-name { font-size: 13px; color: var(--muted); }
    .track { height: 10px; overflow: hidden; border-radius: 999px; background: #edf0f4; }
    .fill { height: 100%; border-radius: inherit; background: var(--blue); }
    .fill.offline { background: #9aa4b2; }
    .split-value { min-width: 45px; text-align: right; font-size: 12px; font-weight: 750; }

    .chart-wrap {
      width: 100%;
      overflow: hidden;
      padding: 3px 0 0;
    }

    .chart-wrap svg {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      overflow: visible;
    }
    .chart-grid { stroke: #e5e7eb; stroke-width: 1; }
    .chart-zero { stroke: #9ca3af; stroke-width: 1.2; }
    .chart-bar {
      fill: var(--blue);
      transition: opacity .15s ease, filter .15s ease, stroke-width .15s ease;
      pointer-events: none;
    }
    .chart-bar.negative { fill: var(--red); }
    .chart-point {
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .chart-point:hover .chart-bar,
    .chart-point:focus .chart-bar,
    .chart-point.selected .chart-bar {
      opacity: 1;
      stroke: #111827;
      stroke-width: 3;
      filter: drop-shadow(0 3px 4px rgba(17,24,39,.16));
    }
    .chart-point:not(.selected) .chart-bar { opacity: .78; }
    .chart-hitbox { fill: transparent; pointer-events: all; }
    .chart-label { fill: #667085; font-size: 11px; pointer-events: none; }
    .chart-value { fill: #344054; font-size: 10px; font-weight: 700; pointer-events: none; }
    .chart-axis-label { fill: #667085; font-size: 10px; font-weight: 650; }
    .chart-axis-unit { fill: #98a2b3; font-size: 9px; }

    .chart-interaction-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 3px 0 9px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }
    .chart-interaction-hint::before {
      content: '☝';
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      font-size: 12px;
    }

    .chart-selection {
      display: grid;
      grid-template-columns: minmax(68px, auto) minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 64px;
      margin-top: 7px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
    }
    .chart-selection-month {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .chart-selection-value {
      text-align: right;
      font-size: clamp(20px, 6vw, 30px);
      font-weight: 850;
      letter-spacing: -.04em;
      overflow-wrap: anywhere;
    }
    .chart-selection.is-empty {
      display: flex;
      justify-content: center;
      min-height: 48px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .rank-list { display: grid; gap: 12px; }
    .rank-item { display: grid; gap: 7px; }
    .rank-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .rank-name { font-size: 13px; font-weight: 750; }
    .rank-value { color: var(--muted); font-size: 12px; text-align: right; }
    .rank-track { height: 9px; border-radius: 999px; background: #edf0f4; overflow: hidden; }
    .rank-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1d4ed8, #60a5fa); }
    .rank-fill.cost { background: linear-gradient(90deg, #64748b, #cbd5e1); }
    .rank-fill.store { background: linear-gradient(90deg, #047857, #6ee7b7); }
    .rank-fill.online { background: linear-gradient(90deg, #6d28d9, #a78bfa); }

    .alert-list { display: grid; gap: 8px; }
    .alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 14px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .alert.warn { background: var(--amber-soft); color: var(--amber); }
    .alert.bad { background: var(--red-soft); color: var(--red); }
    .alert.good { background: var(--green-soft); color: var(--green); }
    .alert-dot { flex: 0 0 8px; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: currentColor; }

    .month-list { display: grid; gap: 9px; }
    details.month {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }
    details.month.planned { opacity: .68; border-style: dashed; }
    details.month[open] { box-shadow: 0 8px 22px rgba(15,23,42,.05); }
    details.month summary { list-style: none; cursor: pointer; padding: 14px; }
    details.month summary::-webkit-details-marker { display: none; }
    .month-summary { display: grid; grid-template-columns: minmax(68px, .7fr) minmax(0, 1fr) minmax(0, 1fr); gap: 9px; align-items: center; }
    .month-name { font-size: 14px; font-weight: 800; }
    .month-status { display: inline-flex; margin-top: 5px; padding: 3px 6px; border-radius: 999px; background: #eef2f7; color: var(--muted); font-size: 10px; font-weight: 700; }
    .month-status.actual { background: var(--blue-soft); color: var(--blue); }
    .month-metric { min-width: 0; text-align: right; }
    .month-metric span { display: block; color: var(--muted); font-size: 10px; }
    .month-metric strong { display: block; margin-top: 3px; font-size: 14px; overflow-wrap: anywhere; }
    .month-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; padding-top: 13px; }
    .detail { padding: 11px; border-radius: 12px; background: var(--surface-soft); }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 5px; font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }

    .profit-block { padding-top: 14px; }
    .profit-block + .profit-block { margin-top: 14px; border-top: 1px solid var(--line); }
    .profit-block-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }
    .profit-block-title strong { font-size: 12px; }
    .profit-block-title span { color: var(--muted); font-size: 10px; text-align: right; }

    details.compact-fold {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfd;
    }
    details.compact-fold summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      list-style: none;
      cursor: pointer;
      padding: 10px 11px;
    }
    details.compact-fold summary::-webkit-details-marker { display: none; }
    .compact-fold-title { min-width: 0; }
    .compact-fold-title strong { display: block; font-size: 11px; }
    .compact-fold-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.35;
    }
    .compact-fold-total {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 800;
      text-align: right;
    }
    .compact-list {
      padding: 0 10px 9px;
      border-top: 1px solid var(--line);
    }
    .compact-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 2px;
      border-bottom: 1px dashed #e8ebef;
      font-size: 10px;
    }
    .compact-row:last-child { border-bottom: 0; }
    .compact-row span { color: var(--muted); overflow-wrap: anywhere; }
    .compact-row strong { flex: 0 0 auto; font-size: 10px; text-align: right; }

    details.annual-fold {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    details.annual-fold > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      list-style: none;
      cursor: pointer;
      padding: 14px 15px;
    }
    details.annual-fold > summary::-webkit-details-marker { display: none; }
    .annual-fold-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }

    .store-cards { display: grid; gap: 10px; }
    .store-card { padding: 15px; border: 1px solid var(--line); border-radius: 16px; }
    .store-card-head { display: flex; justify-content: space-between; gap: 12px; }
    .store-card h3 { margin: 0; font-size: 15px; }
    .store-units { color: var(--muted); font-size: 12px; }
    .store-sales { margin-top: 8px; font-size: 19px; font-weight: 820; letter-spacing: -.04em; }

    .empty, .error-box, .loading {
      padding: 42px 18px;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      box-shadow: var(--shadow);
      text-align: center;
      line-height: 1.55;
    }
    .error-box { color: var(--red); }

    .skeleton { height: 118px; border-radius: var(--radius); background: linear-gradient(90deg, #e8ebef 25%, #f7f8fa 50%, #e8ebef 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 50;
      transform: translateX(-50%);
      width: min(100%, 920px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(15px);
    }

    .nav-btn {
      border: 0;
      border-radius: 13px;
      padding: 9px 3px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .nav-icon { display: block; font-size: 18px; line-height: 1; }
    .nav-label { display: block; margin-top: 5px; font-size: 11px; }
    .nav-btn.active { color: var(--blue); background: var(--blue-soft); font-weight: 800; }

    @media (min-width: 700px) {
      .shell { padding-left: 22px; padding-right: 22px; }
      .overview-period-control { grid-template-columns: 38px 124px 38px; gap: 6px; }
      .overview-period-arrow { width: 38px; }
      .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .store-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bottom-nav { border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topline">
        <div>
          <div class="eyebrow">Birkits Dashboard</div>
          <h1 id="appTitle">경영 대시보드</h1>
          <div class="updated" id="updatedAt">데이터를 불러오는 중</div>
        </div>
        <button class="refresh" id="refreshButton" type="button">새로고침</button>
      </div>
    </header>

    <main id="content">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="메인 메뉴">
    <button class="nav-btn active" type="button" data-page="overview"><span class="nav-icon">⌂</span><span class="nav-label">요약</span></button>
    <button class="nav-btn" type="button" data-page="profit"><span class="nav-icon">₩</span><span class="nav-label">월손익</span></button>
    <button class="nav-btn" type="button" data-page="ads"><span class="nav-icon">◎</span><span class="nav-label">광고</span></button>
    <button class="nav-btn" type="button" data-page="stores"><span class="nav-icon">▦</span><span class="nav-label">점포</span></button>
    <button class="nav-btn" type="button" data-page="online"><span class="nav-icon">◈</span><span class="nav-label">온라인</span></button>
  </nav>

  <script>
    const state = {
      data: null,
      page: 'overview',
      overviewPeriod: '',
      profitYear: null,
      adYear: null,
      storeYear: null,
      onlineYear: null,
      loading: false
    };

    const content = document.getElementById('content');
    const appTitle = document.getElementById('appTitle');
    const updatedAt = document.getElementById('updatedAt');
    const refreshButton = document.getElementById('refreshButton');

    const COST_LABELS = {
      commission: '판매 수수료',
      manufacturing: '제조원가',
      importCost: '수입비',
      delivery: '배송·설치',
      vat: '부가세',
      payroll: '인건비',
      warehouse: '창고비',
      interest: '은행이자',
      accounting: '세무사',
      app: '앱 비용',
      naverAds: '네이버 광고',
      keywordTraffic: '키워드 트래픽',
      marketingFee: '마케팅 수수료'
    };

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbIJRH-XERaaneGqGib6L-FvArO6YGnQEcEmMSZs3ig7Vy09ySfweWpBLEW7zRllkWnQ/exec';
    let chartSequence = 0;
    let requestSequence = 0;
    let loadTimeout = null;
    let activeScript = null;
    let activeCallback = '';

    function makeCallbackName() {
      return '__birkitsDashboard_' +
        Date.now().toString(36) +
        '_' +
        Math.random().toString(36).slice(2);
    }

    function loadData(forceRefresh, retryCount) {
      const attempt = Number(retryCount || 0);
      setLoading(true);
      requestSequence += 1;
      const requestId = requestSequence;

      cleanupJsonp_();
      const callbackName = makeCallbackName();
      activeCallback = callbackName;

      window[callbackName] = function(message) {
        if (requestId !== requestSequence) return;
        cleanupJsonp_(callbackName);
        handleDashboardResponse_(message);
      };

      const query = new URLSearchParams({
        callback: callbackName,
        force: forceRefresh ? '1' : '0',
        t: String(Date.now())
      });

      const retryOrFail = function(message) {
        if (requestId !== requestSequence) return;
        cleanupJsonp_(callbackName);

        if (attempt < 2) {
          updatedAt.textContent = '데이터 연결 재시도 중 · ' + (attempt + 2) + '/3';
          window.setTimeout(function() {
            loadData(forceRefresh, attempt + 1);
          }, 900 + attempt * 700);
          return;
        }

        showConnectionError_(message);
      };

      const script = document.createElement('script');
      script.async = true;
      script.src = APPS_SCRIPT_URL + '?' + query.toString();
      script.dataset.birkitsJsonp = '1';

      script.onerror = function() {
        retryOrFail(
          '웹앱 데이터 요청이 실패했습니다. 잠시 후 새로고침해주세요.'
        );
      };

      activeScript = script;
      document.head.appendChild(script);

      loadTimeout = window.setTimeout(function() {
        if (requestId !== requestSequence || !state.loading) return;
        retryOrFail('데이터 응답 시간이 초과되었습니다. 잠시 후 새로고침해주세요.');
      }, 18000);
    }

    function cleanupJsonp_(callbackName) {
      if (loadTimeout) {
        clearTimeout(loadTimeout);
        loadTimeout = null;
      }

      if (activeScript && activeScript.parentNode) {
        activeScript.parentNode.removeChild(activeScript);
      }
      activeScript = null;

      const name = callbackName || activeCallback;
      if (name && Object.prototype.hasOwnProperty.call(window, name)) {
        try {
          delete window[name];
        } catch (error) {
          window[name] = undefined;
        }
      }
      if (!callbackName || callbackName === activeCallback) activeCallback = '';
    }

    function handleDashboardResponse_(message) {
      if (!message || message.ok !== true) {
        showConnectionError_(
          message && message.error
            ? message.error
            : 'Apps Script에서 올바른 데이터를 받지 못했습니다.'
        );
        return;
      }

      const payload = message.payload;
      if (!payload || !payload.profit || !payload.ads || !payload.stores) {
        showConnectionError_('Apps Script 데이터 형식이 올바르지 않습니다.');
        return;
      }
      if (!payload.online) {
        showConnectionError_('온라인 분석 데이터가 없습니다. 새 Code.gs를 저장한 뒤 웹 앱을 새 버전으로 배포해주세요.');
        return;
      }

      state.data = payload;
      state.profitYear = state.profitYear || first(payload.profit.years);
      state.adYear = state.adYear || first(payload.ads.years);
      state.storeYear = state.storeYear || first(payload.stores.years);
      state.onlineYear = state.onlineYear || first(payload.online.years);
      const overviewMonths = getOverviewMonths(payload.profit);
      const overviewFallback = payload.profit.latestActual || first(overviewMonths) || payload.profit.snapshot;
      if (!state.overviewPeriod || !overviewMonths.some(function(item) { return item.period === state.overviewPeriod; })) {
        state.overviewPeriod = overviewFallback ? overviewFallback.period : '';
      }
      appTitle.textContent = payload.appTitle || '경영 대시보드';
      updatedAt.textContent = '업데이트 ' + (payload.generatedAt || '-');
      setLoading(false);
      render();
    }

    function showConnectionError_(message) {
      setLoading(false);
      updatedAt.textContent = '불러오기 실패';
      content.innerHTML = renderConnectionHelp(message);
    }

    function renderConnectionHelp(message) {
      const diagnosticUrl = APPS_SCRIPT_URL + '?force=1&t=' + Date.now();
      return '<div class="error-box">' +
        '<strong>데이터를 불러오지 못했습니다.</strong><br><br>' +
        escapeHtml(message).replace(/\n/g, '<br>') +
        '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px">' +
          '<button type="button" onclick="loadData(true)" style="border:0;border-radius:12px;padding:11px 14px;background:#111827;color:#fff;font-weight:750;cursor:pointer">다시 불러오기</button>' +
          '<a href="' + diagnosticUrl + '" target="_blank" rel="noopener" style="display:inline-block;padding:11px 14px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;color:#111827;text-decoration:none;font-weight:750">웹앱 응답 확인</a>' +
        '</div>' +
        '<div style="margin-top:12px;color:#667085;font-size:12px;line-height:1.55">응답 확인 화면에 JSON이 보이면 Apps Script는 정상입니다. 오류가 보이면 배포 버전이나 시트 탭 이름을 확인해주세요.</div>' +
      '</div>';
    }

    function setLoading(value) {
      state.loading = value;
      refreshButton.disabled = value;
      refreshButton.textContent = value ? '불러오는 중' : '새로고침';
      if (value && !state.data) {
        content.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      }
    }

    function render() {
      if (!state.data) return;
      if (state.page === 'profit') content.innerHTML = renderProfitPage();
      else if (state.page === 'ads') content.innerHTML = renderAdsPage();
      else if (state.page === 'stores') content.innerHTML = renderStoresPage();
      else if (state.page === 'online') content.innerHTML = renderOnlinePage();
      else content.innerHTML = renderOverviewPage();
    }

    function renderOverviewPage() {
      const profit = state.data.profit;
      const availableMonths = getOverviewMonths(profit);
      const fallback = profit.latestActual || profit.snapshot || first(availableMonths) || {};
      const selected = availableMonths.find(function(item) {
        return item.period === state.overviewPeriod;
      }) || fallback;
      const selectedPeriod = selected.period || '';
      const recent = availableMonths.filter(function(item) {
        return !selectedPeriod || item.period <= selectedPeriod;
      }).slice(0, 12).reverse();
      const selectedStore = (state.data.stores.monthly || []).find(function(item) {
        return item.period === selectedPeriod;
      }) || null;
      const selectedAd = (state.data.ads.monthly || []).find(function(item) {
        return item.period === selectedPeriod;
      }) || null;
      const alerts = buildAlerts(selected, selectedAd, selectedStore);

      return [
        '<section class="hero">',
          '<div class="hero-top"><div class="hero-label">' + escapeHtml(selected.label) + ' 매출</div>' + overviewPeriodSelect(availableMonths, selectedPeriod) + '</div>',
          '<div class="hero-value">' + shortWon(selected.revenue) + '</div>',
          '<div class="hero-sub">손익 <strong class="' + signClass(selected.profit) + '">' + signedWon(selected.profit) + '</strong> · 판매 ' + formatNumber(selected.units) + '세트</div>',
          '<div class="hero-tags">',
            '<span class="hero-tag">온라인 ' + percent(selected.onlineShare) + '</span>',
            '<span class="hero-tag">오프라인 ' + percent(selected.offlineShare) + '</span>',
            '<span class="hero-tag">광고비율 ' + percent(selected.adShare) + '</span>',
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">핵심 지표</h2><div class="section-note">' + escapeHtml(selected.label) + ' 기준</div></div></div>',
          '<div class="kpi-grid">',
            kpi('예상손익', signedWon(selected.profit), '손익률 ' + percent(selected.profitMargin), signClass(selected.profit)),
            kpi('온라인 매출', shortWon(selected.online), percent(selected.onlineShare) + ' 비중'),
            kpi('오프라인 매출', shortWon(selected.offline), percent(selected.offlineShare) + ' 비중'),
            kpi('광고 총비용', shortWon(selected.adSpend), '매출의 ' + percent(selected.adShare)),
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">최근 12개월 매출</h2><div class="section-note">선택 월까지 실적이 입력된 월만 표시</div></div></div>',
          barChart(recent, 'revenue', 'won'),
        '</section>',

        '<div class="two-col">',
          '<section class="section">',
            '<div class="section-head"><div><h2 class="section-title">온라인·오프라인</h2><div class="section-note">' + escapeHtml(selected.label) + ' 매출 구성</div></div></div>',
            splitBar('온라인', selected.onlineShare, selected.online, ''),
            splitBar('오프라인', selected.offlineShare, selected.offline, 'offline'),
          '</section>',

          '<section class="section">',
            '<div class="section-head"><div><h2 class="section-title">주요 비용</h2><div class="section-note">' + escapeHtml(selected.label) + '</div></div></div>',
            rankBars(costRanking(selected.costs, 6), 'cost'),
          '</section>',
        '</div>',

        selectedStore ? '<section class="section"><div class="section-head"><div><h2 class="section-title">점포 월 현황</h2><div class="section-note">' + escapeHtml(selectedStore.label) + '</div></div></div><div class="kpi-grid">' +
          kpi('점포 판매액', shortWon(selectedStore.totalSales), exactWon(selectedStore.totalSales)) +
          kpi('점포 판매대수', formatNumber(selectedStore.totalUnits) + '대', '전체 점포 합계') +
          kpi('최다 판매점', escapeHtml(topStore(selectedStore.stores, 'sales').name || '-'), shortWon(topStore(selectedStore.stores, 'sales').sales || 0)) +
          kpi('누적 점포판매', shortWon(state.data.stores.totalSales), formatNumber(state.data.stores.totalUnits) + '대') +
          '</div></section>' : '<section class="section"><div class="section-head"><div><h2 class="section-title">점포 월 현황</h2><div class="section-note">' + escapeHtml(selected.label) + '</div></div></div><div class="empty">선택한 월의 점포 데이터가 없습니다.</div></section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">체크 포인트</h2><div class="section-note">입력된 데이터 기준 자동 확인</div></div></div>',
          '<div class="alert-list">' + alerts.join('') + '</div>',
        '</section>'
      ].join('');
    }

    function renderProfitPage() {
      const data = state.data.profit;
      const year = Number(state.profitYear || first(data.years));
      const annual = data.annual.find(function(item) { return item.year === year; }) || {};
      const months = data.monthly.filter(function(item) { return item.year === year && item.status === 'actual'; }).sort(function(a,b) { return b.month - a.month; });
      const actualMonths = months.slice().reverse();
      const costGroups = getProfitCostGroups(months);

      return [
        '<section class="section">',
          sectionHeader('월 손익', year + '년 실적과 비용 내역', yearSelect('profitYear', data.years, year)),
          '<div class="kpi-grid">',
            kpi('연 매출', shortWon(annual.revenue || 0), exactWon(annual.revenue || 0)),
            kpi('연 손익', signedWon(annual.profit || 0), '손익률 ' + percent(annual.profitMargin || 0), signClass(annual.profit || 0)),
            kpi('판매세트', formatNumber(annual.units || 0) + '세트', '월평균 ' + formatNumber((data.averages[String(year)] || {}).units || 0)),
            kpi('광고비', shortWon(annual.adSpend || 0), '매출의 ' + percent(annual.adShare || 0)),
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 손익 추이</h2><div class="section-note">0선을 기준으로 흑자·적자 확인</div></div></div>',
          actualMonths.length ? barChart(actualMonths, 'profit', 'won', true) : '<div class="empty">입력된 월 실적이 없습니다.</div>',
        '</section>',

        '<section class="section">',
          '<details class="annual-fold">',
            '<summary>',
              '<div><h2 class="section-title">연간 비용 전체</h2><div class="section-note">모든 비용 항목의 선택 연도 합계</div></div>',
              '<strong>' + shortWon(sumProfitCosts(months)) + '</strong>',
            '</summary>',
            '<div class="annual-fold-body">' + annualCostDetails(months, costGroups) + '</div>',
          '</details>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 상세</h2><div class="section-note">모든 손익 항목을 확인할 수 있습니다. 반복 비용은 안쪽에 접혀 있습니다.</div></div></div>',
          '<div class="month-list">' + (months.length ? months.map(function(item) { return profitMonthCard(item, costGroups); }).join('') : '<div class="empty">데이터가 없습니다.</div>') + '</div>',
        '</section>'
      ].join('');
    }

    function renderAdsPage() {
      const data = state.data.ads;
      const year = Number(state.adYear || first(data.years));
      const months = data.monthly.filter(function(item) { return item.year === year && item.status === 'actual'; }).sort(function(a,b) { return b.month - a.month; });
      const actual = months;
      const totalSales = sum(actual, 'sales');
      const totalSpend = sum(actual, 'adSpend');
      const measured = months.find(function(item) { return item.searchRoas || item.searchConversionRevenue || item.searchCpa; }) || null;
      const chartData = actual.slice().reverse();

      return [
        '<section class="section">',
          sectionHeader('광고 성과', year + '년 광고비와 매출 기여', yearSelect('adYear', data.years, year)),
          '<div class="kpi-grid">',
            kpi('총 광고비', shortWon(totalSpend), exactWon(totalSpend)),
            kpi('광고비/매출', percent(safeDivide(totalSpend, totalSales)), '매출 ' + shortWon(totalSales)),
            kpi('최근 검색 ROAS', measured ? percent(measured.searchRoas) : '-', measured ? measured.label + ' 측정값' : '측정값 없음'),
            kpi('최근 전환매출', measured ? shortWon(measured.searchConversionRevenue) : '-', measured ? '전환당 ' + exactWon(measured.searchCpa) : '측정값 없음'),
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">광고비 비율 추이</h2><div class="section-note">월 매출 대비 광고 총비용</div></div></div>',
          chartData.length ? barChart(chartData, 'adShare', 'percent') : '<div class="empty">입력된 광고 실적이 없습니다.</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 광고 성과</h2><div class="section-note">검색광고 측정값이 없는 월은 총광고비만 표시</div></div></div>',
          '<div class="month-list">' + (months.length ? months.map(adMonthCard).join('') : '<div class="empty">데이터가 없습니다.</div>') + '</div>',
        '</section>'
      ].join('');
    }

    function renderStoresPage() {
      const data = state.data.stores;
      const year = Number(state.storeYear || first(data.years));
      const yearData = data.yearly.find(function(item) { return item.year === year; }) || { totalUnits: 0, totalSales: 0, stores: [] };
      const months = data.monthly.filter(function(item) { return item.year === year && (item.totalSales || item.totalUnits); }).sort(function(a,b) { return b.month - a.month; });
      const ranking = yearData.stores.slice().sort(function(a,b) { return b.sales - a.sales; });

      return [
        '<section class="section">',
          sectionHeader('점포별 현황', year + '년 부가세 포함 매출', yearSelect('storeYear', data.years, year)),
          '<div class="kpi-grid">',
            kpi('판매액', shortWon(yearData.totalSales), exactWon(yearData.totalSales)),
            kpi('판매대수', formatNumber(yearData.totalUnits) + '대', '해당 연도 합계'),
            kpi('1위 점포', ranking.length ? escapeHtml(ranking[0].name) : '-', ranking.length ? shortWon(ranking[0].sales) : '-'),
            kpi('점포 수', formatNumber(ranking.length) + '개', '집계 대상 점포'),
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">점포 매출 순위</h2><div class="section-note">' + year + '년 판매액 기준</div></div></div>',
          rankBars(ranking.map(function(item) { return { name: item.name, value: item.sales, sub: formatNumber(item.units) + '대' }; }), 'store'),
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 점포 매출</h2><div class="section-note">부가세 포함 판매액</div></div></div>',
          months.length ? barChart(months.slice().reverse(), 'totalSales', 'won') : '<div class="empty">입력된 월 실적이 없습니다.</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 상세</h2><div class="section-note">점포별 판매액과 대수</div></div></div>',
          '<div class="month-list">' + (months.length ? months.map(storeMonthCard).join('') : '<div class="empty">데이터가 없습니다.</div>') + '</div>',
        '</section>'
      ].join('');
    }

    function renderOnlinePage() {
      const data = state.data.online;
      const year = Number(state.onlineYear || first(data.years));
      const yearData = data.yearly.find(function(item) { return item.year === year; }) || {
        totalSales: 0,
        totalRevenue: 0,
        channelTotal: 0,
        unclassifiedSales: 0,
        onlineShare: 0,
        channels: []
      };
      const months = data.monthly.filter(function(item) {
        return item.year === year && (item.totalSales || item.channelTotal);
      }).sort(function(a,b) { return b.month - a.month; });
      const ranking = (yearData.channels || []).filter(function(item) {
        return item.sales !== 0;
      }).sort(function(a,b) { return b.sales - a.sales; });
      const topChannel = ranking.length ? ranking[0] : null;
      const monthlyAverage = months.length ? yearData.totalSales / months.length : 0;
      const hasGap = ranking.length > 0 && Math.abs(Number(yearData.unclassifiedSales || 0)) >= 1;

      return [
        '<section class="section">',
          sectionHeader('온라인 채널 매출', year + '년 채널별 판매 분석', yearSelect('onlineYear', data.years, year)),
          '<div class="kpi-grid">',
            kpi('온라인 매출', shortWon(yearData.totalSales), exactWon(yearData.totalSales)),
            kpi('전체 매출 비중', percent(yearData.onlineShare), '전체 매출 ' + shortWon(yearData.totalRevenue)),
            kpi('1위 채널', topChannel ? escapeHtml(topChannel.name) : '-', topChannel ? shortWon(topChannel.sales) + ' · ' + percent(safeDivide(topChannel.sales, yearData.totalSales)) : '입력값 없음'),
            kpi('월평균', shortWon(monthlyAverage), months.length + '개월 실적 기준'),
          '</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">채널별 매출 순위</h2><div class="section-note">월 손익계산 월별 행 AE~AI · ' + year + '년 합계</div></div></div>',
          rankBars(ranking.map(function(item) {
            return {
              name: item.name,
              value: item.sales,
              sub: percent(safeDivide(item.sales, yearData.totalSales))
            };
          }), 'online'),
          (hasGap
            ? '<div class="alert-list" style="margin-top:14px">' + alertItem('warn', '온라인 총매출과 월별 채널 합계의 차이가 ' + exactWon(yearData.unclassifiedSales) + ' 있습니다. 해당 월 AE~AI 참조값을 확인해주세요.') + '</div>'
            : ''),
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 온라인 매출</h2><div class="section-note">선택 연도의 온라인 총매출 추이</div></div></div>',
          months.length ? barChart(months.slice().reverse(), 'totalSales', 'won') : '<div class="empty">입력된 온라인 매출이 없습니다.</div>',
        '</section>',

        '<section class="section">',
          '<div class="section-head"><div><h2 class="section-title">월별 채널 상세</h2><div class="section-note">각 월 행 AE~AI의 채널 매출과 구성비</div></div></div>',
          '<div class="month-list">' + (months.length ? months.map(onlineMonthCard).join('') : '<div class="empty">데이터가 없습니다.</div>') + '</div>',
        '</section>'
      ].join('');
    }

    function profitMonthCard(item, costGroups) {
      const groups = costGroups || getProfitCostGroups([item]);
      const variableKeys = groups.variableKeys || [];
      const fixedKeys = groups.fixedKeys || [];

      const variableCostDetails = variableKeys.map(function(key) {

              detail('예상손익', exactWon(item.profit)) +
              detail('손익 전년 대비', signedPercent(item.profitYoy)) +
              detail('손익률', percent(item.profitMargin)) +

              detail('온라인 매출', exactWon(item.online)) +
              detail('온라인 비중', percent(item.onlineShare)) +
              detail('오프라인 매출', exactWon(item.offline)) +
              detail('오프라인 비중', percent(item.offlineShare)) +
              detail('전체 비용 합계', exactWon(item.totalCosts)) +

              detail('광고비율', percent(item.adShare)) +
            '</div>' +
          '</div>' +

          '<div class="profit-block">' +
            '<div class="profit-block-title"><strong>변동·주요 비용</strong><span>월마다 변하거나 실적에 직접 연동되는 항목</span></div>' +
            '<div class="detail-grid">' + (variableCostDetails || detail('변동 비용', '없음')) + '</div>' +
          '</div>' +

          (fixedKeys.length
            ? '<details class="compact-fold">' +
                '<summary>' +
                  '<div class="compact-fold-title"><strong>고정·반복 비용 ' + fixedKeys.length + '개</strong><span>기본으로 접어두고 필요할 때 확인</span></div>' +

    function onlineMonthCard(item) {
      const channels = (item.channels || []).filter(function(channel) {

          '<div class="month-metric"><span>1위 채널</span><strong>' + (topChannel ? escapeHtml(topChannel.name) : '-') + '</strong></div>' +

    function buildAlerts(latest, latestAd, latestStore) {
      const result = [];
      if (latest.profit < 0) result.push(alertItem('bad', latest.label + ' 손익이 ' + signedWon(latest.profit) + '으로 적자입니다.'));
      else result.push(alertItem('good', latest.label + ' 손익이 ' + signedWon(latest.profit) + '으로 흑자입니다.'));

      if (latest.adShare >= .1) result.push(alertItem('warn', '광고비가 매출의 ' + percent(latest.adShare) + '입니다. 광고 효율을 점검하세요.'));
      else result.push(alertItem('good', '광고비 비율은 매출의 ' + percent(latest.adShare) + '입니다.'));

      if (latest.offlineShare >= .25) result.push(alertItem('warn', '오프라인 매출 비중이 ' + percent(latest.offlineShare) + '로 높아졌습니다.'));
      if (latestStore && latestStore.totalSales < 0) result.push(alertItem('bad', latestStore.label + ' 점포 매출에 환불·조정 금액이 포함되어 있습니다.'));
      if (latestAd && latestAd.adShare >= .12) result.push(alertItem('warn', latestAd.label + ' 광고비/매출 비율이 ' + percent(latestAd.adShare) + '입니다.'));
      return result;
    }

    function getProfitCostGroups(months) {
      const records = months || [];
      const allKeys = Object.keys(COST_LABELS);

      // 성격상 고정비에 가까운 항목은 기본 접힘으로 둡니다.
      const defaultFixed = {
        payroll: true,
        warehouse: true,
        interest: true,
        accounting: true,
        app: true
      };

      // 실적과 직접 연동되는 비용은 값이 우연히 같아도 변동비로 유지합니다.
      const alwaysVariable = {
        commission: true,
        manufacturing: true,
        importCost: true,
        delivery: true,
        vat: true,
        naverAds: true,
        keywordTraffic: true,
        marketingFee: true
      };

      const fixedKeys = [];
      const variableKeys = [];

      allKeys.forEach(function(key) {
        if (defaultFixed[key]) {
          fixedKeys.push(key);
          return;
        }

        if (alwaysVariable[key]) {
          variableKeys.push(key);
          return;
        }

        const values = records
          .map(function(item) { return Math.round(Number((item.costs || {})[key] || 0)); })
          .filter(function(value) { return value !== 0; });

        let repeated = false;
        if (values.length >= 3) {
          const counts = {};
          values.forEach(function(value) {
            counts[String(value)] = (counts[String(value)] || 0) + 1;
          });
          const highest = Math.max.apply(null, Object.keys(counts).map(function(value) { return counts[value]; }));
          repeated = highest / values.length >= .7;
        }

        if (repeated) fixedKeys.push(key);
        else variableKeys.push(key);
      });

      return {
        fixedKeys: fixedKeys,
        variableKeys: variableKeys
      };
    }

    function sumProfitCosts(months) {
      return (months || []).reduce(function(total, item) {
        return total + Number(item.totalCosts || 0);
      }, 0);
    }

    function annualCostDetails(months, groups) {
      const costGroups = groups || getProfitCostGroups(months);
      const allKeys = (costGroups.variableKeys || []).concat(costGroups.fixedKeys || []);
      const totals = {};

      allKeys.forEach(function(key) {
        totals[key] = (months || []).reduce(function(total, item) {
          return total + Number((item.costs || {})[key] || 0);
        }, 0);
      });

      const visible = (costGroups.variableKeys || []).map(function(key) {
        return detail(COST_LABELS[key] || key, exactWon(totals[key]));
      }).join('');

      const fixedRows = (costGroups.fixedKeys || []).map(function(key) {
        return compactRow(COST_LABELS[key] || key, exactWon(totals[key]));
      }).join('');

      const fixedTotal = (costGroups.fixedKeys || []).reduce(function(total, key) {
        return total + Number(totals[key] || 0);
      }, 0);

      return '<div class="profit-block">' +
          '<div class="profit-block-title"><strong>변동·주요 비용 합계</strong><span>선택 연도 실제 입력 월 기준</span></div>' +
          '<div class="detail-grid">' + (visible || detail('변동 비용', '없음')) + '</div>' +
        '</div>' +
        ((costGroups.fixedKeys || []).length
          ? '<details class="compact-fold">' +
              '<summary>' +
                '<div class="compact-fold-title"><strong>고정·반복 비용 합계</strong><span>' + costGroups.fixedKeys.length + '개 항목</span></div>' +
                '<div class="compact-fold-total">' + shortWon(fixedTotal) + '</div>' +
              '</summary>' +
              '<div class="compact-list">' + fixedRows + '</div>' +
            '</details>'
          : '');
    }

    function compactRow(label, value) {
      return '<div class="compact-row"><span>' + escapeHtml(label) + '</span><strong>' + value + '</strong></div>';
    }

    function signedPercent(value) {
      const number = Number(value || 0);
      const sign = number > 0 ? '+' : '';
      return sign + percent(number);
    }

    function alertItem(type, text) {
      return '<div class="alert ' + type + '"><span class="alert-dot"></span><span>' + escapeHtml(text) + '</span></div>';
    }

    function kpi(label, value, sub, className) {
      return '<article class="kpi"><div class="kpi-label">' + escapeHtml(label) + '</div><div class="kpi-value ' + (className || '') + '">' + value + '</div>' + (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</article>';
    }

    function detail(label, value) {
      return '<div class="detail"><div class="detail-label">' + escapeHtml(label) + '</div><div class="detail-value">' + value + '</div></div>';
    }

    function sectionHeader(title, note, control) {
      return '<div class="section-head"><div><h2 class="section-title">' + escapeHtml(title) + '</h2><div class="section-note">' + escapeHtml(note) + '</div></div>' + (control || '') + '</div>';
    }

    function yearSelect(key, years, selected) {
      return '<select class="year-select" data-filter="' + key + '">' + years.map(function(year) {
        return '<option value="' + year + '" ' + (Number(selected) === Number(year) ? 'selected' : '') + '>' + year + '년</option>';
      }).join('') + '</select>';
    }

    function overviewPeriodSelect(months, selected) {
      if (!months || !months.length) return '<div class="overview-period-control"><button class="overview-period-arrow" type="button" disabled aria-label="이전 월">‹</button><select class="overview-period-select" aria-label="요약 기준 월" disabled><option>월 데이터 없음</option></select><button class="overview-period-arrow" type="button" disabled aria-label="다음 월">›</button></div>';
      const selectedIndex = Math.max(0, months.findIndex(function(item) { return item.period === selected; }));
      const olderMonth = months[selectedIndex + 1] || null;
      const newerMonth = selectedIndex > 0 ? months[selectedIndex - 1] : null;
      return '<div class="overview-period-control">' +
        overviewPeriodArrow('이전 월', '‹', olderMonth) +
        '<select class="overview-period-select" data-filter="overviewPeriod" aria-label="요약 기준 월">' + months.map(function(item) {
          const compactLabel = item.year && item.month ? item.year + '. ' + item.month + '월' : item.label;
          return '<option value="' + escapeHtml(item.period) + '" ' + (item.period === selected ? 'selected' : '') + '>' + escapeHtml(compactLabel) + '</option>';
        }).join('') + '</select>' +
        overviewPeriodArrow('다음 월', '›', newerMonth) +
      '</div>';
    }

    function overviewPeriodArrow(label, symbol, month) {
      return '<button class="overview-period-arrow" type="button" aria-label="' + label + '"' +
        (month ? ' data-overview-period="' + escapeHtml(month.period) + '"' : ' disabled') +
        '><span aria-hidden="true">' + symbol + '</span></button>';
    }

    function getOverviewMonths(profit) {
      const data = profit || {};
      const months = (data.monthly || []).filter(function(item) {
        return item.status === 'actual' || Number(item.revenue || 0) > 0;
      });
      const fallback = data.latestActual || data.snapshot;
      if (fallback && fallback.period && !months.some(function(item) { return item.period === fallback.period; })) {
        months.push(fallback);
      }
      return months.sort(function(a, b) {
        return String(b.period).localeCompare(String(a.period));
      });
    }

    function splitBar(name, ratio, value, extraClass) {
      const safeRatio = clamp(ratio, 0, 1);
      return '<div class="split-row"><div class="split-name">' + escapeHtml(name) + '</div><div class="track"><div class="fill ' + (extraClass || '') + '" style="width:' + (safeRatio * 100).toFixed(1) + '%"></div></div><div class="split-value">' + percent(ratio) + '</div></div>';
    }

    function rankBars(items, type) {
      if (!items || !items.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';
      const max = Math.max.apply(null, items.map(function(item) { return Math.abs(item.value || 0); }).concat([1]));
      return '<div class="rank-list">' + items.map(function(item) {
        const width = Math.max(2, Math.abs(item.value || 0) / max * 100);
        return '<div class="rank-item"><div class="rank-head"><span class="rank-name">' + escapeHtml(item.name) + '</span><span class="rank-value">' + (item.sub ? escapeHtml(item.sub) + ' · ' : '') + shortWon(item.value || 0) + '</span></div><div class="rank-track"><div class="rank-fill ' + (type || '') + '" style="width:' + width.toFixed(1) + '%"></div></div></div>';
      }).join('') + '</div>';
    }

    function costRanking(costs, limit) {
      return Object.keys(costs || {}).map(function(key) {
        return { name: COST_LABELS[key] || key, value: Number(costs[key] || 0) };
      }).filter(function(item) { return item.value !== 0; }).sort(function(a,b) { return Math.abs(b.value) - Math.abs(a.value); }).slice(0, limit || 99);
    }

    function barChart(records, key, kind, showZero) {
      if (!records || !records.length) return '<div class="empty">표시할 데이터가 없습니다.</div>';

      chartSequence += 1;
      const chartId = 'chart-' + chartSequence;
      const width = 720;
      const height = 270;
      const padLeft = 70;
      const padRight = 16;
      const padTop = 24;
      const padBottom = 42;
      const chartWidth = width - padLeft - padRight;
      const chartHeight = height - padTop - padBottom;
      const values = records.map(function(item) { return Number(item[key] || 0); });

      let min = Math.min.apply(null, values);
      let max = Math.max.apply(null, values);
      if (showZero || min < 0) min = Math.min(0, min);
      else min = 0;
      max = Math.max(0, max);
      if (max === min) max = min + 1;

      const y = function(value) {
        return padTop + (max - value) / (max - min) * chartHeight;
      };
      const zeroY = y(0);
      const slotWidth = chartWidth / records.length;
      const barWidth = Math.max(8, Math.min(38, slotWidth * .58));
      const tickPositions = [0, .25, .5, .75, 1];

      const axisFormat = function(value) {
        if (kind === 'percent') return percent(value);
        return shortWon(value);
      };

      const grid = tickPositions.map(function(p) {
        const gy = padTop + chartHeight * p;
        const tickValue = max - (max - min) * p;
        return '<g>' +
          '<line class="chart-grid" x1="' + padLeft + '" y1="' + gy.toFixed(1) + '" x2="' + (width - padRight) + '" y2="' + gy.toFixed(1) + '"></line>' +
          '<text class="chart-axis-label" x="' + (padLeft - 8) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end">' + escapeHtml(axisFormat(tickValue)) + '</text>' +
        '</g>';
      }).join('');

      const bars = records.map(function(item, index) {
        const value = Number(item[key] || 0);
        const centerX = padLeft + slotWidth * index + slotWidth / 2;
        const valueY = y(value);
        const rectY = Math.min(valueY, zeroY);
        const rectHeight = Math.max(1.5, Math.abs(zeroY - valueY));
        const shortValue = kind === 'percent' ? percent(value) : shortWon(value);
        const exactValue = kind === 'percent' ? percent(value) : exactWon(value);
        const pointLabel = item.label || (item.month ? item.month + '월' : String(index + 1));
        const showValue = records.length <= 6 || index === records.length - 1;
        const valueLabelY = value >= 0
          ? Math.max(12, rectY - 7)
          : Math.min(height - padBottom - 3, rectY + rectHeight + 13);

        return '<g class="chart-point" tabindex="0" role="button" aria-label="' +
            escapeHtml(pointLabel + ', ' + exactValue + '. 값을 크게 보려면 선택') +
            '" data-chart-point data-chart-id="' + chartId +
            '" data-chart-label="' + escapeHtml(pointLabel) +
            '" data-chart-value="' + escapeHtml(exactValue) + '">' +
          '<rect class="chart-hitbox" x="' + (padLeft + slotWidth * index).toFixed(1) +
            '" y="' + padTop + '" width="' + slotWidth.toFixed(1) +
            '" height="' + (chartHeight + 30) + '"></rect>' +
          '<rect class="chart-bar ' + (value < 0 ? 'negative' : '') +
            '" x="' + (centerX - barWidth / 2).toFixed(1) +
            '" y="' + rectY.toFixed(1) +
            '" width="' + barWidth.toFixed(1) +
            '" height="' + rectHeight.toFixed(1) +
            '" rx="4"></rect>' +
          '<text class="chart-label" x="' + centerX.toFixed(1) +
            '" y="' + (height - 16) +
            '" text-anchor="middle">' + item.month + '월</text>' +
          (showValue
            ? '<text class="chart-value" x="' + centerX.toFixed(1) +
                '" y="' + valueLabelY.toFixed(1) +
                '" text-anchor="middle">' + escapeHtml(shortValue) + '</text>'
            : '') +
        '</g>';
      }).join('');

      const unitLabel = kind === 'percent' ? '단위: %' : '단위: 원';

      return '<div class="chart-widget" data-chart-widget="' + chartId + '">' +
        '<div class="chart-interaction-hint">막대를 누르면 월별 정확한 값이 크게 표시됩니다.</div>' +
        '<div class="chart-wrap">' +
          '<svg viewBox="0 0 ' + width + ' ' + height +
            '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="월별 막대그래프. 막대를 선택하면 정확한 값을 확인할 수 있습니다.">' +
            '<text class="chart-axis-unit" x="' + (padLeft - 8) + '" y="12" text-anchor="end">' + unitLabel + '</text>' +
            grid +
            '<line class="chart-zero" x1="' + padLeft +
              '" y1="' + zeroY.toFixed(1) +
              '" x2="' + (width - padRight) +
              '" y2="' + zeroY.toFixed(1) + '"></line>' +
            bars +
          '</svg>' +
        '</div>' +
        '<div class="chart-selection is-empty" aria-live="polite">' +
          '<span>☝ 막대 하나를 선택해보세요</span>' +
        '</div>' +
      '</div>';
    }

    function topStore(stores, key) {
      if (!stores || !stores.length) return {};
      return stores.slice().sort(function(a,b) { return Number(b[key] || 0) - Number(a[key] || 0); })[0] || {};
    }

    function sum(items, key) {
      return (items || []).reduce(function(total, item) { return total + Number(item[key] || 0); }, 0);
    }

    function first(items) { return items && items.length ? items[0] : null; }
    function safeDivide(a, b) { return b ? a / b : 0; }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, Number(value || 0))); }

    function exactWon(value) {
      const number = Math.round(Number(value || 0));
      return (number < 0 ? '-₩' : '₩') + Math.abs(number).toLocaleString('ko-KR');
    }

    function signedWon(value) {
      const number = Number(value || 0);
      const sign = number > 0 ? '+' : number < 0 ? '-' : '';
      return sign + shortWon(Math.abs(number));
    }

    function shortWon(value) {
      const number = Number(value || 0);
      const sign = number < 0 ? '-' : '';
      const abs = Math.abs(number);
      if (abs >= 100000000) return sign + trimZero(abs / 100000000, 1) + '억';
      if (abs >= 10000) return sign + Math.round(abs / 10000).toLocaleString('ko-KR') + '만';
      return sign + Math.round(abs).toLocaleString('ko-KR') + '원';
    }

    function percent(value) {
      const number = Number(value || 0) * 100;
      const digits = Math.abs(number) >= 100 ? 0 : 1;
      return trimZero(number, digits) + '%';
    }

    function trimZero(value, digits) {
      return Number(value || 0).toFixed(digits).replace(/\.0+$/, '');
    }

    function formatNumber(value) {
      return Math.round(Number(value || 0)).toLocaleString('ko-KR');
    }

    function signClass(value) {
      return Number(value || 0) > 0 ? 'positive' : Number(value || 0) < 0 ? 'negative' : 'neutral';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.querySelector('.bottom-nav').addEventListener('click', function(event) {
      const button = event.target.closest('[data-page]');
      if (!button) return;
      state.page = button.dataset.page;
      document.querySelectorAll('[data-page]').forEach(function(item) {
        item.classList.toggle('active', item === button);
      });
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    content.addEventListener('change', function(event) {
      const select = event.target.closest('[data-filter]');
      if (!select) return;
      const key = select.dataset.filter;
      state[key] = key === 'overviewPeriod' ? select.value : Number(select.value);
      render();
    });

    function selectChartPoint(point) {
      if (!point) return;
      const widget = point.closest('[data-chart-widget]');
      if (!widget) return;

      widget.querySelectorAll('[data-chart-point]').forEach(function(item) {
        item.classList.toggle('selected', item === point);
        item.setAttribute('aria-pressed', item === point ? 'true' : 'false');
      });

      const selection = widget.querySelector('.chart-selection');
      if (!selection) return;

      selection.classList.remove('is-empty');
      selection.innerHTML =
        '<div class="chart-selection-month">' + escapeHtml(point.dataset.chartLabel || '-') + '</div>' +
        '<div class="chart-selection-value">' + escapeHtml(point.dataset.chartValue || '-') + '</div>';
    }

    content.addEventListener('click', function(event) {
      const periodButton = event.target.closest('[data-overview-period]');
      if (periodButton) {
        state.overviewPeriod = periodButton.dataset.overviewPeriod;
        render();
        return;
      }
      const point = event.target.closest('[data-chart-point]');
      if (point) selectChartPoint(point);
    });

    content.addEventListener('keydown', function(event) {
      const point = event.target.closest('[data-chart-point]');
      if (!point) return;
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectChartPoint(point);
      }
    });

    refreshButton.addEventListener('click', function() { loadData(true); });
    loadData(false);
  </script>
</body>
</html>
